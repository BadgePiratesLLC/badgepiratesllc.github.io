name: auto-publish-drafts
on:
  schedule:
    - cron: '0 13 * * *'   # daily 13:00 UTC (~8am Central) — promotes drafts whose publish_on has arrived
  workflow_dispatch: {}
permissions:
  contents: write
  pages: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: Promote drafts whose publish_on has arrived
        run: node .github/scripts/promote-drafts.mjs
      - name: Commit & push if anything was promoted
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "badgepirates-autopublish[bot]"
            git config user.email "autopublish@badgepirates.com"
            git add -A
            git commit -m "Auto-publish: promote scheduled draft(s) to _posts"
            git push
            echo "PROMOTED=1" >> "$GITHUB_ENV"
            # Newly-promoted post slugs, one per line, for the live-check step below.
            git diff --name-only HEAD~1 HEAD -- _posts \
              | sed -E 's#^_posts/[0-9]{4}-[0-9]{2}-[0-9]{2}-(.*)\.md$#\1#' > /tmp/promoted_slugs.txt
          else
            echo "No drafts due today."
          fi
      - name: Request a Pages rebuild (belt-and-suspenders)
        if: env.PROMOTED == '1'
        continue-on-error: true
        run: gh api -X POST repos/${{ github.repository }}/pages/builds
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # AC2/AC3 (Nexus 5615468f): a promoted post is not "published" just
      # because this workflow's steps exited 0 — the 2026-08-17 EP7 incident
      # was a workflow SUCCESS while the site stayed stale for 5 days behind
      # a transient 429 on the Pages deploy action. The only signal that
      # matters is whether the post's live URL actually serves it, so poll
      # that directly and retry the Pages build (with backoff) if it hasn't
      # shown up yet, instead of trusting the exit code above.
      - name: End-to-end verify — retry Pages build until the post is actually live
        if: env.PROMOTED == '1'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          fail=0
          while read -r slug; do
            [ -z "$slug" ] && continue
            url="https://blog.badgepirates.com/${slug}/"
            echo "verifying: $url"
            ok=0
            for backoff in 60 90 150 240 300; do
              sleep "$backoff"
              code=$(curl -s -o /dev/null -w '%{http_code}' -L "$url")
              echo "  attempt (slept ${backoff}s): HTTP $code"
              if [ "$code" = "200" ]; then ok=1; break; fi
              echo "  not live yet — re-requesting a Pages build (retry-with-backoff)"
              gh api -X POST "repos/${{ github.repository }}/pages/builds" || true
            done
            if [ "$ok" != "1" ]; then
              echo "::error::$url never returned 200 after retries — post did NOT go live despite workflow steps succeeding"
              fail=1
            else
              echo "  confirmed live: $url"
            fi
          done < /tmp/promoted_slugs.txt
          exit $fail
